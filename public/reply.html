<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudLabs — Support Tickets</title>
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d0d0d;color:#eee;font-family:'Inter',sans-serif;min-height:100vh;}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:#161616;border:1px solid #262626;border-radius:16px;padding:40px;max-width:380px;width:100%;}
.login-card h1{font-size:18px;font-weight:700;color:#c9a84c;margin-bottom:4px;letter-spacing:0.05em;}
.login-card p{font-size:13px;color:#888;margin-bottom:24px;}
.login-inp{width:100%;background:#0d0d0d;border:1.5px solid #262626;border-radius:8px;padding:12px 14px;font-size:14px;color:#eee;outline:none;margin-bottom:12px;font-family:'Inter',sans-serif;}
.login-inp:focus{border-color:#c9a84c;}
.login-btn{width:100%;background:linear-gradient(180deg,#e8c97a 0%,#c9a84c 45%,#b8934a 100%);border:1px solid rgba(184,147,74,0.5);color:#111;padding:12px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(201,168,76,0.35),inset 0 1px 0 rgba(255,255,255,0.5);}
.login-err{font-size:12px;color:#e74c3c;margin-top:10px;text-align:center;}
#dashboard{display:none;max-width:1200px;margin:0 auto;padding:32px 20px 60px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:20px;font-weight:700;color:#fff;}
.topbar span{font-size:12px;color:#c9a84c;font-family:'Space Mono',monospace;}
.btn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all 0.15s;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-gold{background:linear-gradient(180deg,#e8c97a 0%,#c9a84c 45%,#b8934a 100%);color:#111;box-shadow:0 3px 10px rgba(201,168,76,0.35);}
.btn-gold:hover:not(:disabled){filter:brightness(1.06);}
.btn-outline{background:transparent;border:1.5px solid #333;color:#ccc;}
.btn-outline:hover:not(:disabled){border-color:#c9a84c;color:#c9a84c;}
.layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;}
@media(max-width:800px){.layout{grid-template-columns:1fr;}}
.ticket-list{background:#161616;border:1px solid #262626;border-radius:14px;padding:12px;max-height:75vh;overflow-y:auto;}
.ticket-item{padding:14px;border-radius:10px;cursor:pointer;margin-bottom:8px;border:1px solid transparent;transition:all 0.15s;}
.ticket-item:hover{background:#1a1a1a;}
.ticket-item.selected{background:#1a1a1a;border-color:#c9a84c;}
.ticket-name{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;}
.ticket-preview{font-size:12px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px;}
.ticket-meta{display:flex;justify-content:space-between;align-items:center;}
.ticket-id{font-size:10px;color:#666;font-family:'Space Mono',monospace;}
.status-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;text-transform:uppercase;}
.badge-open{background:rgba(201,168,76,0.15);color:#c9a84c;}
.badge-resolved{background:rgba(39,174,96,0.15);color:#27ae60;}
.thread-card{background:#161616;border:1px solid #262626;border-radius:14px;padding:24px;min-height:75vh;display:flex;flex-direction:column;}
.thread-header{border-bottom:1px solid #262626;padding-bottom:16px;margin-bottom:16px;}
.thread-header h2{font-size:16px;color:#fff;margin-bottom:4px;}
.thread-header p{font-size:12px;color:#888;}
.thread-messages{flex:1;overflow-y:auto;margin-bottom:16px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:80%;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap;}
.msg-user{background:#1a1a1a;align-self:flex-start;color:#eee;}
.msg-admin{background:linear-gradient(180deg,#e8c97a 0%,#c9a84c 45%,#b8934a 100%);align-self:flex-end;color:#111;}
.msg-time{font-size:10px;color:#666;margin-top:4px;}
.msg-admin .msg-time{color:rgba(17,17,17,0.5);}
.reply-box{border-top:1px solid #262626;padding-top:16px;}
.reply-textarea{width:100%;background:#0d0d0d;border:1.5px solid #262626;border-radius:8px;padding:12px 14px;font-size:13px;color:#eee;outline:none;font-family:'Inter',sans-serif;min-height:90px;resize:vertical;margin-bottom:10px;}
.reply-textarea:focus{border-color:#c9a84c;}
.reply-actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#888;}
.empty-state{text-align:center;color:#666;font-size:13px;padding:60px 20px;}
.status-msg{font-size:12px;margin-top:8px;padding:8px 12px;border-radius:8px;display:none;}
.status-ok{background:rgba(39,174,96,0.1);color:#27ae60;}
.status-err{background:rgba(231,76,60,0.1);color:#e74c3c;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>AudLabs Support</h1>
    <p>Admin access required to manage support tickets.</p>
    <div style="position:relative;display:flex;align-items:center;">
      <input type="password" class="login-inp" id="admin-pass" placeholder="Admin password" style="padding-right:44px;margin-bottom:0;" onkeydown="if(event.key==='Enter')adminLogin()">
      <button type="button" onclick="toggleAdminPwd()" style="position:absolute;right:10px;background:none;border:none;cursor:pointer;color:#999;padding:0;margin:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;" id="admin-pwd-eye">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="login-btn" style="margin-top:12px;" onclick="adminLogin()">Sign In</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <div>
      <h1>Support Tickets</h1>
      <span>reply.audlabs.io</span>
    </div>
    <button class="btn btn-outline" onclick="adminLogout()">Sign Out</button>
  </div>

  <div class="layout">
    <div class="ticket-list" id="ticket-list">
      <div class="empty-state">Loading tickets...</div>
    </div>
    <div class="thread-card" id="thread-card">
      <div class="empty-state">Select a ticket to view the conversation.</div>
    </div>
  </div>
</div>

<script>
const BACKEND = "https://app.audlabs.io";
let adminPassword = "";
let allTickets = [];
let selectedTicket = null;

function toggleAdminPwd(){
  var pwInput = document.getElementById("admin-pass");
  var eyeBtn = document.getElementById("admin-pwd-eye");
  if(pwInput.type === "password"){
    pwInput.type = "text";
    eyeBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  } else {
    pwInput.type = "password";
    eyeBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
}
function adminLogin(){
  const pass = document.getElementById("admin-pass").value;
  if(!pass){ document.getElementById("login-err").textContent = "Please enter password"; return; }
  if(pass !== "(Oluwaseyi23)"){
    document.getElementById("login-err").textContent = "Incorrect password";
    return;
  }
  adminPassword = "audlabs-admin-2026";
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadTickets();
}
function adminLogout(){
  adminPassword = "";
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("admin-pass").value = "";
}
async function loadTickets(){
  try{
    const res = await fetch(BACKEND + "/api/admin/tickets-list", {
      headers: {"x-admin-secret":adminPassword}
    });
    const data = await res.json();
    const list = document.getElementById("ticket-list");
    if(!data.success || !data.tickets.length){
      list.innerHTML = '<div class="empty-state">No support tickets yet.</div>';
      return;
    }
    allTickets = data.tickets;
    renderTicketList();
  }catch(e){
    document.getElementById("ticket-list").innerHTML = '<div class="empty-state">Failed to load tickets.</div>';
  }
}
function renderTicketList(){
  const list = document.getElementById("ticket-list");
  list.innerHTML = allTickets.map(function(t){
    const lastMsg = t.messages[t.messages.length - 1];
    const isSelected = selectedTicket && selectedTicket.ticketId === t.ticketId;
    return `<div class="ticket-item ${isSelected ? 'selected' : ''}" onclick='openTicket("${t.ticketId}")'>
      <div class="ticket-name">${t.name}</div>
      <div class="ticket-preview">${lastMsg ? lastMsg.body.replace(/</g,"&lt;") : ""}</div>
      <div class="ticket-meta">
        <span class="ticket-id">${t.ticketId}</span>
        <span class="status-badge ${t.status === 'resolved' ? 'badge-resolved' : 'badge-open'}">${t.status}</span>
      </div>
    </div>`;
  }).join("");
}
function openTicket(ticketId){
  selectedTicket = allTickets.find(function(t){ return t.ticketId === ticketId; });
  renderTicketList();
  renderThread();
}
function renderThread(){
  const card = document.getElementById("thread-card");
  if(!selectedTicket){
    card.innerHTML = '<div class="empty-state">Select a ticket to view the conversation.</div>';
    return;
  }
  const t = selectedTicket;
  const messagesHtml = t.messages.map(function(m){
    const time = new Date(m.timestamp).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    return `<div class="msg ${m.from === 'admin' ? 'msg-admin' : 'msg-user'}">${m.body.replace(/</g,"&lt;")}<div class="msg-time">${time}</div></div>`;
  }).join("");
  card.innerHTML = `
    <div class="thread-header">
      <h2>${t.name}</h2>
      <p>${t.email} · ${t.ticketId}</p>
    </div>
    <div class="thread-messages">${messagesHtml}</div>
    <div class="reply-box">
      <textarea class="reply-textarea" id="reply-input" placeholder="Type your reply..."></textarea>
      <div class="reply-actions">
        <label class="checkbox-row"><input type="checkbox" id="mark-resolved-check" ${t.status === 'resolved' ? '' : ''}> Mark as resolved</label>
        <button class="btn btn-gold" id="send-reply-btn" onclick="sendReply()">Send Reply</button>
      </div>
      <div class="status-msg" id="reply-status"></div>
    </div>
  `;
}
async function sendReply(){
  const replyBody = document.getElementById("reply-input").value.trim();
  const markResolved = document.getElementById("mark-resolved-check").checked;
  const statusEl = document.getElementById("reply-status");
  const btn = document.getElementById("send-reply-btn");
  if(!replyBody){ statusEl.className = "status-msg status-err"; statusEl.textContent = "Please type a reply."; statusEl.style.display = "block"; return; }
  btn.disabled = true; btn.textContent = "Sending...";
  try{
    const res = await fetch(BACKEND + "/api/admin/reply-ticket", {
      method: "POST",
      headers: {"Content-Type":"application/json","x-admin-secret":adminPassword},
      body: JSON.stringify({ ticketId: selectedTicket.ticketId, replyBody: replyBody, markResolved: markResolved })
    });
    const data = await res.json();
    if(data.success){
      statusEl.className = "status-msg status-ok"; statusEl.textContent = "Reply sent!"; statusEl.style.display = "block";
      await loadTickets();
      selectedTicket = allTickets.find(function(t){ return t.ticketId === selectedTicket.ticketId; });
      renderThread();
    } else {
      statusEl.className = "status-msg status-err"; statusEl.textContent = data.error || "Failed to send reply."; statusEl.style.display = "block";
    }
  }catch(e){
    statusEl.className = "status-msg status-err"; statusEl.textContent = "Error: " + e.message; statusEl.style.display = "block";
  }
  btn.disabled = false; btn.textContent = "Send Reply";
}
</script>
</body>
</html>
