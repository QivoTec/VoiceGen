workflows:
  ios-capacitor-workflow:
    name: AudLabs iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Copy web assets and sync Capacitor
        script: |
          npx cap sync ios
          ls -la ios/App/App/
      - name: Build unsigned iOS app (for testing purposes)
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme $XCODE_SCHEME \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            build
    artifacts:
      - ios/App/build/**/*.app
    publishing:
      email:
        recipients:
          - hello@audlabs.io
        notify:
          success: true
          failure: true
